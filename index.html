<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YY PARTSHAN — YESU YA FUGA</title>
<style>*{box-sizing:border-box}:root{--bg:#f1f4f8;--ink:#0f1e33;--muted:#64748b;--line:#e2e8f0;--orange:#f97316}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}
header{background:linear-gradient(135deg,#0f1e33,#16324f 65%,#1e3a5f);color:#fff;position:sticky;top:0;z-index:20}
.top{max-width:1240px;margin:0 auto;padding:18px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.brand{display:flex;gap:14px;align-items:center}.logo{width:52px;height:52px;border-radius:14px;background:#f97316;display:grid;place-items:center;font-size:26px}
header h1{margin:0;font-size:26px}header h1 span{color:#fbbf24}.sub{color:#cbd5e1;font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-top:5px}
.pill{display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#34d399}.clock{font-family:monospace;font-size:13px;color:#e2e8f0;margin-top:7px;text-align:right}
.wrap{max-width:1240px;margin:0 auto;padding:18px 22px 40px}.tabs{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:8px;border-radius:14px}
.tabs button{background:transparent;color:#334155;border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.tabs button.on{background:#0f1e33;color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 6px 24px rgba(15,30,51,.07)}
h2{margin:0 0 6px;font-size:22px}h3{margin:0 0 12px}.small{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:700px){.g2,.g4{grid-template-columns:1fr}}
.kpi{font-size:26px;font-weight:900;font-family:monospace}label{font-size:12px;font-weight:800;text-transform:uppercase;color:#475569;display:block;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:15px}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;background:#f97316;color:#fff;font-size:14px}button.sec{background:#0f1e33}button.ghost{background:#f1f5f9;color:#334155;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left}th,td{border-top:1px solid var(--line);padding:11px 8px;vertical-align:top}
.banner{border-radius:12px;padding:13px;font-weight:700;font-size:14px}.ok{background:#ecfdf5;color:#065f46}.warn{background:#fffbeb;color:#92400e}.info{background:#eff6ff;color:#1e40af}.err{background:#fef2f2;color:#991b1b}
.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#059669}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
</style></head><body><div style="background:#dc2626;color:#fff;text-align:center;padding:10px;font-weight:900;font-size:15px">YY PARTSHAN FUELS • ONLINE • YESU YA FUGA</div>
<header><div class="top"><div class="brand"><div class="logo">⛽</div><div id="msgBanner" style="background:#eff6ff;color:#1e40af;text-align:center;padding:12px;font-weight:800;font-size:14px;display:none"></div><div><h1>YY PARTSHAN <span>FUELS</span></h1><div class="sub">Yesu Ya Fuga • Nabyewanga, Masaka Road</div></div></div><div><span class="pill"><span class="dot"></span><span id="status">YY Partshan • Saved </span></span><div class="clock" id="clock"></div></div></div></header>
<div class="wrap"><div class="tabs" id="tabs"></div><div id="app"></div><footer class="small" style="text-align:center;padding:10px">YY Partshan Fuels • Member pricing — save 30 UGX per litre • Petrol &amp; Diesel • Admin PIN default 1234</footer></div>
<script>
const SB="https://tnemymundarkdjruyvrnt.YY Partshan.co/rest/v1/app_records";
const KEY="sb_publishable_1KHOnldpNIaRZtIzU453xg_mNZNQdeq";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 127 bytes].ljW7bZqV4tIpM1rHluZMsE67mkWYMhqZCpGIfur9BYc";
const H={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=representation"};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const fmt=n=>"UGX "+Math.round(n||0).toLocaleString("en-UG");
const stamp=()=>{const d=new Date();return{timestamp:d.toISOString(),date:d.toISOString().slice(0,10),dateLabel:d.toLocaleDateString("en-GB"),timeLabel:d.toLocaleTimeString("en-GB"),fullTimestamp:d.toLocaleString("en-GB")}};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");

let DB={members:[],attendants:[],transactions:[],deliveries:[],settings:[],audit:[],pumps:[],expenses:[]};
let view="Dashboard",isAdmin=false,search="",SAVEDMODE=true;
function setSavedMode(on){SAVEDMODE=true;const s=document.getElementById("status");if(s)s.textContent="Saved • Saved  • "+DB.members.length+" customers";}

function localKey(c){return "yy_partshan_local_"+c} function localList(c){try{return JSON.parse(localStorage.getItem(localKey(c))||"[]")}catch(e){return[]}} function localSave(c,r){localStorage.setItem(localKey(c),JSON.stringify(r))}
function showMsg(m){try{let el=document.getElementById("msg");if(el){el.textContent=m;el.style.display="block";}else{let d=document.createElement("div");d.id="msg";d.style.cssText="position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#0f766e;color:#fff;padding:12px 18px;border-radius:10px;z-index:9999;font-weight:700;max-width:90%";d.textContent=m;document.body.appendChild(d);} }catch(e){alert(m);}}
function localKey(c){return "yy_partshan_"+c} function localList(c){try{return JSON.parse(localStorage.getItem(localKey(c))||"[]")}catch(e){return[]}} function localSave(c,r){localStorage.setItem(localKey(c),JSON.stringify(r))}
async function sbList(col){return localList(col);}
async function fetchTimeout(url,opts,ms=4000){const c=new AbortController();const timer=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...(opts||{}),signal:c.signal});clearTimeout(timer);return r;}catch(e){clearTimeout(timer);throw e;}}
async function sbCreate(col,val,key){const rid=key||uid();let rows=localList(col);if(!rows.find(x=>x.id===rid))rows.push({id:rid,value:val});localSave(col,rows);try{const r=await fetchTimeout(SB,{method:"POST",headers:{...H,Prefer:"return=representation"},body:JSON.stringify({collection:col,record_id:rid,value:val})});if(!r.ok)throw new Error("Supabase "+r.status);}catch(e){}return rid;}
async function sbReplace(col,id,val){let rows=localList(col);let i=rows.findIndex(x=>x.id===id);if(i>=0)rows[i].value=val;else rows.push({id,value:val});localSave(col,rows);}
async function sbDelete(col,id){localSave(col,localList(col).filter(x=>x.id!==id));}
async function trySync(){showMsg("Syncing…");let ok=true;try{for(let col of Object.keys(DB)){for(let r of localList(col)){const res=await fetchTimeout(SB,{method:"POST",headers:{...H,Prefer:"return=representation"},body:JSON.stringify({collection:col,record_id:r.id,value:r.value})});if(!res.ok)ok=false;}}}catch(e){ok=false;}showMsg(ok?"Saved + Synced to YY Partshan.":"Saved.");load();}
async function load(){try{for(let c of Object.keys(DB)){DB[c]=localList(c);}}catch(e){}document.getElementById("status").textContent="YY Partshan • Saved • "+DB.members.length+" customers";render();setTimeout(async()=>{try{for(let c of Object.keys(DB)){try{const rows=await sbList(c);if(rows&&rows.length)DB[c]=rows;}catch(e){}}document.getElementById("status").textContent="YY Partshan • Saved • "+DB.members.length+" customers";render();}catch(e){}},200);}
async function trySync(){showMsg("Checking YY Partshan…");try{for(let col of Object.keys(DB)){for(let r of localList(col)){await sFetch(SB,{method:"POST",headers:{...H,Prefer:"return=representation,resolution=merge-duplicates"},body:JSON.stringify({collection:col,record_id:r.id,value:r.value})});}}showMsg("✅ Synced to YY Partshan!");}catch(e){showMsg("Saved.");}load();}
function settings(){const s=DB.settings[0]?.value||{};return{prices:{Petrol:5850,Diesel:5450},discountPerLitre:30,adminPin:"1234",...s,prices:{Petrol:5850,Diesel:5450,...(s.prices||{})}};}
function custId(n){return "YY-"+String(n).padStart(3,"0")} function attId(n){return "ATT-"+String(n).padStart(3,"0")}
function nextCust(){let m=0;DB.members.forEach(x=>{let n=parseInt((x.value.customerId||"").replace("YY-",""));if(n>m)m=n});return custId(m+1)}
function nextAtt(){let m=0;DB.attendants.forEach(x=>{let n=parseInt((x.value.attendantId||"").replace("ATT-",""));if(n>m)m=n});return attId(m+1)}
function memberStats(id){let bal=0,debt=0,dep=0,fuel=0,disc=0;DB.transactions.forEach(t=>{const v=t.value;if(v.memberId!==id)return;if(v.kind==="deposit"){let td=Math.min(v.amount,debt);debt-=td;bal+=v.amount-td;dep+=v.amount;}if(v.kind==="fuel"){if(v.isCredit)debt+=v.amount;else bal-=v.amount;fuel+=v.amount;disc+=v.discount||0;}});return{bal,debt,dep,fuel,disc};}
function stock(fuel){let s=0;DB.deliveries.forEach(d=>{if(d.value.fuel===fuel)s+=d.value.litres||0});DB.transactions.forEach(t=>{if(t.value.kind==="fuel"&&t.value.fuel===fuel)s-=t.value.litres||0});return s;}
function nav(){const tabs=["Dashboard","Customers","Attendants","Deposit Money","Issue Fuel","Transactions","Fuel Stock","Daily Closing","Deliveries","Expenses","Statement","Settings"];document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="${t===view?"on":""}" onclick="view='${t}';render()">${t}</button>`).join("")+`<button class="ghost" onclick="retryRefresh()">Refresh</button><button class="ghost" onclick="trySync()">Sync</button>`;}
async function saveTx(v){const id=await sbCreate("transactions",v,"tx-"+uid());DB.transactions.push({id,value:v});}
function calcFuel(){const el=document.getElementById("calc");if(!el)return;const S=settings();const f=document.getElementById("ffuel").value;const l=parseFloat(document.getElementById("fL").value||0);const pump=S.prices[f];const member=Math.max(0,pump-S.discountPerLitre);el.innerHTML=`Pump ${fmt(pump)} • Member ${fmt(member)} • Litres ${l} • Discount ${fmt(l*S.discountPerLitre)} • <b>Pay ${fmt(l*member)}</b> • Stock ${stock(f).toFixed(1)} L`;}
function render(){nav();const el=document.getElementById("app");const S=settings();const today=new Date().toISOString().slice(0,10);let todayTx=DB.transactions.filter(t=>t.value.date===today);let todayFuel=todayTx.filter(t=>t.value.kind==="fuel");let todayAmt=todayFuel.reduce((a,t)=>a+t.value.amount,0);let todayL=todayFuel.reduce((a,t)=>a+(t.value.litres||0),0);let todayDisc=todayFuel.reduce((a,t)=>a+(t.value.discount||0),0);let totalBal=DB.members.reduce((a,m)=>a+memberStats(m.id).bal,0);let totalDebt=DB.members.reduce((a,m)=>a+memberStats(m.id).debt,0);
if(SAVEDMODE)el.innerHTML=`<div class="card banner warn">All entries are saved. Use <b>Export Backup</b> in Settings to keep a copy.</div>`;else el.innerHTML="";
if(view==="Dashboard"){el.innerHTML+=`<div class="card"><h2>Overview — ${new Date().toLocaleDateString("en-GB")}</h2><div class="grid g4"><div><div class="small">TOTAL MEMBER BALANCE</div><div class="kpi">${fmt(totalBal)}</div></div><div><div class="small">TODAY SALES</div><div class="kpi">${fmt(todayAmt)}</div></div><div><div class="small">TODAY LITRES</div><div class="kpi">${todayL.toFixed(1)} L</div></div><div><div class="small">TODAY DISCOUNT</div><div class="kpi">${fmt(todayDisc)}</div></div></div><p class="small">Members <b>${DB.members.length}</b> • Attendants <b>${DB.attendants.length}</b> • Total debt <b>${fmt(totalDebt)}</b> • Petrol stock <b>${stock("Petrol").toFixed(1)} L</b> • Diesel <b>${stock("Diesel").toFixed(1)} L</b></p></div><div class="card"><h3>Search</h3><input placeholder="Search customers, transactions, attendants…" value="${esc(search)}" oninput="search=this.value;render()"></div><div class="card"><h3>Recent transactions</h3>${DB.transactions.slice().reverse().slice(0,15).map(t=>`<div class="row"><span><b>${esc(t.value.kind)}</b> • ${esc(t.value.memberName||"")} • ${fmt(t.value.amount)} ${t.value.litres?`• ${t.value.litres} L ${esc(t.value.fuel||"")}`:""}</span><span class="small">${esc(t.value.dateLabel||t.value.date||"")} ${esc(t.value.timeLabel||"")}</span></div>`).join("")||"No transactions yet."}</div>`;}
if(view==="Customers"){el.innerHTML+=`<div class="card"><h2>Register Customer — next ID ${nextCust()}</h2><label>Name</label><input id="cn"><label>Phone</label><input id="cp"><label>Plate (optional)</label><input id="cpl"><button style="margin-top:12px" onclick="addCustomer()">Register Customer</button></div><div class="card"><h3>Customers (${DB.members.length})</h3><input placeholder="Search name / phone / ID" oninput="search=this.value;render()" value="${esc(search)}">${DB.members.filter(m=>(m.value.name+" "+m.value.phone+" "+(m.value.customerId||"")).toLowerCase().includes(search.toLowerCase())).map(m=>{const st=memberStats(m.id);return `<div class="row"><span><b>${esc(m.value.customerId)}</b> — ${esc(m.value.name)} • ${esc(m.value.phone)} • Balance <b>${fmt(st.bal)}</b> ${st.debt?`• Debt <b style="color:red">${fmt(st.debt)}</b>`:""}</span><span>${isAdmin?`<button class="ghost" onclick="delCustomer('${m.id}')">Delete (Admin)</button>`:""}</span></div>`}).join("")}</div><div class="card"><button onclick="adminLogin()">Admin Login (PIN)</button> <span class="small">${isAdmin?"Admin ON":"Attendant mode"}</span></div>`;}
if(view==="Attendants"){el.innerHTML+=`<div class="card"><h2>Register Attendant — next ID ${nextAtt()}</h2><label>Name</label><input id="an"><label>Phone</label><input id="ap"><button style="margin-top:12px" onclick="addAttendant()">Register Attendant</button></div><div class="card"><h3>Attendants</h3>${DB.attendants.map(a=>`<div class="row"><span><b>${esc(a.value.attendantId)}</b> — ${esc(a.value.name)} • ${esc(a.value.phone)}</span></div>`).join("")||"None yet"}</div>`;}
if(view==="Deposit Money"){el.innerHTML+=`<div class="card"><h2>Deposit Money</h2><label>Customer</label><select id="dCust">${DB.members.map(m=>`<option value="${m.id}">${esc(m.value.customerId)} — ${esc(m.value.name)} (Bal ${fmt(memberStats(m.id).bal)}${memberStats(m.id).debt?`, Debt ${fmt(memberStats(m.id).debt)}`:""})</option>`).join("")}</select><label>Amount (UGX)</label><input id="dAmt" type="number"><label>Attendant</label><select id="dAtt"><option value="">Select Attendant</option>${DB.attendants.map(a=>`<option value="${a.id}">${esc(a.value.attendantId)} — ${esc(a.value.name)}</option>`).join("")}</select><button style="margin-top:12px" onclick="doDeposit()">Save Deposit</button><p class="small">If customer has debt, deposit clears debt first, remainder goes to balance.</p></div>`;}
if(view==="Issue Fuel"){el.innerHTML+=`<div class="card"><h2>Issue Fuel</h2><label>Customer</label><select id="fCust">${DB.members.map(m=>`<option value="${m.id}">${esc(m.value.customerId)} — ${esc(m.value.name)} (Bal ${fmt(memberStats(m.id).bal)}${memberStats(m.id).debt?`, Debt ${fmt(memberStats(m.id).debt)} — NO new credit`:""})</option>`).join("")}</select><label>Fuel</label><select id="ffuel"><option>Petrol</option><option>Diesel</option></select><label>Litres</label><input id="fL" type="number" step="0.1" oninput="calcFuel()"><div id="calc" class="banner warn" style="margin-top:10px"></div><label>Pump *</label><select id="fPump"><option value="">Select Pump</option><option>Pump 1</option><option>Pump 2</option></select><label>Attendant *</label><select id="fAtt"><option value="">Select Attendant</option>${DB.attendants.map(a=>`<option value="${a.id}">${esc(a.value.attendantId)} — ${esc(a.value.name)}</option>`).join("")}</select><label>Shift *</label><select id="fShift"><option value="">Select Shift</option><option>Day Shift</option><option>Night Shift</option></select><label><input type="checkbox" id="fCredit"> Take on CREDIT (only if no existing debt)</label><br><button style="margin-top:12px" onclick="doFuel()">Save Fuel Issue</button></div>`;calcFuel();}
if(view==="Transactions"){el.innerHTML+=`<div class="card"><h2>Transactions / Ledger</h2><input placeholder="Search…" oninput="search=this.value;render()" value="${esc(search)}"><table><tr><th>Date + Time</th><th>Customer</th><th>Type</th><th>Fuel / Litres</th><th>Amount</th><th>Attendant</th><th>Pump / Shift</th><th></th></tr>${DB.transactions.slice().reverse().filter(t=>JSON.stringify(t.value).toLowerCase().includes(search.toLowerCase())).map(t=>`<tr><td>${esc(t.value.dateLabel||t.value.date)} ${esc(t.value.timeLabel||"")}</td><td>${esc(t.value.memberName||"")}</td><td>${esc(t.value.kind)} ${t.value.isCredit?"(CREDIT)":""}</td><td>${esc(t.value.fuel||"")} ${t.value.litres||""}</td><td>${fmt(t.value.amount)}</td><td>${esc(t.value.attendantName||"")}</td><td>${esc(t.value.pump||"")} ${esc(t.value.shift||"")}</td><td>${isAdmin?`<button class="ghost" onclick="delTx('${t.id}')">Delete</button>`:""}</td></tr>`).join("")}</table></div>`;}
if(view==="Fuel Stock"){el.innerHTML+=`<div class="card"><h2>Fuel Stock</h2>${["Petrol","Diesel"].map(f=>{let s=stock(f);let cap=f==="Petrol"?20000:25000;let pct=Math.min(100,s/cap*100);return `<div style="margin:12px 0"><b>${f}</b> — ${s.toFixed(1)} L of ${cap} L (${pct.toFixed(1)}%)<div class="bar"><i style="width:${pct}%"></i></div></div>`}).join("")}</div><div class="card"><h3>Add Delivery (Stock In)</h3><label>Fuel</label><select id="dlF"><option>Petrol</option><option>Diesel</option></select><label>Litres</label><input id="dlL" type="number"><label>Supplier (optional)</label><input id="dlS"><button style="margin-top:12px" onclick="doDelivery()">Add Delivery</button></div>`;}

if(view==="Daily Closing"){let d=new Date().toISOString().slice(0,10);let tx=DB.transactions.filter(x=>x.value.date===d);let fuel=tx.filter(x=>x.value.kind==="fuel");let dep=tx.filter(x=>x.value.kind==="deposit");let petrol=fuel.filter(x=>x.value.fuel==="Petrol");let diesel=fuel.filter(x=>x.value.fuel==="Diesel");let sum=a=>a.reduce((s,x)=>s+(x.value.amount||0),0);let sumL=a=>a.reduce((s,x)=>s+(x.value.litres||0),0);el.innerHTML+=`<div class="card"><h2>Daily Closing — ${d}</h2><p><b>Total Fuel Sales:</b> UGX ${sum(fuel).toLocaleString()} — ${sumL(fuel).toFixed(1)} L</p><p><b>Petrol:</b> UGX ${sum(petrol).toLocaleString()} — ${sumL(petrol).toFixed(1)} L</p><p><b>Diesel:</b> UGX ${sum(diesel).toLocaleString()} — ${sumL(diesel).toFixed(1)} L</p><p><b>Deposits Today:</b> UGX ${sum(dep).toLocaleString()} (${dep.length})</p><p><b>Fuel Issues Today:</b> ${fuel.length}</p><p><b>Total Customers:</b> ${DB.members.length}</p></div>`;}
if(view==="Deliveries"){el.innerHTML+=`<div class="card"><h2>Fuel Deliveries</h2>${DB.deliveries.length===0?"<p>No deliveries yet. Add one in Fuel Stock.</p>":DB.deliveries.map(d=>`<p>${d.value.date||""} — ${d.value.fuel||""} — ${d.value.litres||0} L — UGX ${(d.value.amount||0).toLocaleString()}</p>`).join("")}</div>`;}
if(view==="Expenses"){el.innerHTML+=`<div class="card"><h2>Expenses</h2><p>Total: UGX ${DB.expenses.reduce((a,x)=>a+(x.value.amount||0),0).toLocaleString()}</p>${DB.expenses.length===0?"<p>No expenses yet.</p>":DB.expenses.map(e=>`<p>${e.value.date||""} — ${e.value.title||""} — UGX ${(e.value.amount||0).toLocaleString()}</p>`).join("")}<h3>Add Expense</h3><input id="exTitle" placeholder="Expense title"><input id="exAmt" type="number" placeholder="Amount UGX"><button onclick="addExpense()">Save Expense</button></div>`;}
if(view==="Statement"){el.innerHTML+=`<div class="card"><h2>Customer Statement</h2>${DB.members.map(m=>{let st=memberStats(m.id);let tx=DB.transactions.filter(x=>x.value.memberId===m.id);return `<div style="border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:8px"><b>${m.value.name||""} (${m.value.customerId||""})</b> — Balance: UGX ${st.bal.toLocaleString()} — Debt: UGX ${st.debt.toLocaleString()}<br>${tx.length===0?"No transactions yet.":tx.map(x=>`<span>${x.value.date||""} — ${x.value.kind||""} ${x.value.fuel||""} — ${x.value.litres||0} L — UGX ${(x.value.amount||0).toLocaleString()}</span><br>`).join("")}</div>`}).join("")}</div>`;}
if(view==="Settings"){const S2=settings();el.innerHTML+=`<div class="card"><h2>Settings</h2><label>Petrol pump price</label><input id="sP" type="number" value="${S2.prices.Petrol}" ${isAdmin?"":"disabled"}><label>Diesel pump price</label><input id="sD" type="number" value="${S2.prices.Diesel}" ${isAdmin?"":"disabled"}><label>Discount per litre</label><input id="sDisc" type="number" value="${S2.discountPerLitre}" ${isAdmin?"":"disabled"}><label>Admin PIN</label><input id="sPin" value="${S2.adminPin}" ${isAdmin?"":"disabled"}><button style="margin-top:12px" onclick="saveSettings()">Save Settings</button><button style="margin-top:12px;margin-left:8px" onclick="exportBackup()">Export Backup (Download)</button><p class="small">${isAdmin?"Admin can edit.":"Only Admin can edit prices / discount / PIN."} <button class="ghost" onclick="adminLogin()">Admin Login</button></p></div><div class="card"><h3>Audit Log (Admin only)</h3>${isAdmin?DB.audit.slice().reverse().map(a=>`<div class="row"><span>${esc(a.value.action||"")} — ${esc(a.value.targetLabel||"")} — ${esc(a.value.reason||"")}</span></div>`).join("")||"No audit yet":"Login as Admin to see Audit Log."}</div>`;}
}
async function addCustomer(){const n=document.getElementById("cn").value.trim(),p=document.getElementById("cp").value.trim(),pl=document.getElementById("cpl").value.trim();if(!n||!p){showMsg("Name + Phone required");return;}const v={name:n,phone:p,plate:pl,customerId:nextCust(),status:"Active",dateJoined:new Date().toISOString().slice(0,10)};const id="cust-"+uid();DB.members.push({id,value:v});localSave("members",DB.members);render();showMsg("Customer saved: "+v.customerId);try{await sbCreate("members",v,id);}catch(e){}}
async function addAttendant(){const n=document.getElementById("an").value.trim(),p=document.getElementById("ap").value.trim();if(!n||!p){showMsg("Name + Phone required");return;}const v={name:n,phone:p,attendantId:nextAtt(),status:"Active"};const id="att-"+uid();DB.attendants.push({id,value:v});localSave("attendants",DB.attendants);render();showMsg("Attendant saved: "+v.attendantId);try{await sbCreate("attendants",v,id);}catch(e){}}
async function doDeposit(){try{const mid=document.getElementById("dCust").value,amt=parseFloat(document.getElementById("dAmt").value||0),att=document.getElementById("dAtt").value;if(!mid||!amt)return showMsg("Customer + Amount required");const m=DB.members.find(x=>x.id===mid),a=DB.attendants.find(x=>x.id===att);const s=stamp();const v={kind:"deposit",memberId:mid,memberName:m.value.name,amount:amt,attendantName:a?.value.name||"",attendantPhone:a?.value.phone||"",attendantId:a?.value.attendantId||"",...s};await saveTx(v);showMsg("Deposit saved "+fmt(amt));render();}catch(e){showMsg("Could NOT save deposit.\n\n"+e.message);}}
async function doFuel(){try{const mid=document.getElementById("fCust").value,fuel=document.getElementById("ffuel").value,l=parseFloat(document.getElementById("fL").value||0),pump=document.getElementById("fPump").value,att=document.getElementById("fAtt").value,shift=document.getElementById("fShift").value,credit=document.getElementById("fCredit").checked;if(!mid||!l||!pump||!att||!shift)return showMsg("Customer, litres, Pump, Attendant and Shift are all required");if(l>stock(fuel))return showMsg("Not enough stock: "+stock(fuel).toFixed(1)+" L");const S=settings();const m=DB.members.find(x=>x.id===mid),a=DB.attendants.find(x=>x.id===att);const st=memberStats(mid);if(credit&&st.debt>0)return showMsg("Customer already has debt "+fmt(st.debt)+". Clear it first — one credit only.");const memberPrice=Math.max(0,S.prices[fuel]-S.discountPerLitre);const amt=l*memberPrice;if(!credit&&amt>st.bal)return showMsg("Not enough balance. Balance "+fmt(st.bal)+", need "+fmt(amt)+". Use CREDIT if allowed.");const s=stamp();const v={kind:"fuel",memberId:mid,memberName:m.value.name,amount:amt,fuel,pump,litres:l,pumpPrice:S.prices[fuel],memberPrice,normalTotal:l*S.prices[fuel],discount:l*S.discountPerLitre,isCredit:credit,attendantName:a.value.name,attendantPhone:a.value.phone,attendantId:a.value.attendantId,shift,...s};await saveTx(v);showMsg("Fuel saved: "+l+" L "+fuel+" = "+fmt(amt)+(credit?" on CREDIT":""));render();}catch(e){showMsg("Could NOT save fuel.\n\n"+e.message);}}
async function doDelivery(){try{const f=document.getElementById("dlF").value,l=parseFloat(document.getElementById("dlL").value||0),sup=document.getElementById("dlS").value;if(!l)return showMsg("Litres required");const v={fuel:f,litres:l,supplier:sup,...stamp()};const id=await sbCreate("deliveries",v,"dl-"+uid());DB.deliveries.push({id,value:v});showMsg("Delivery added");render();}catch(e){showMsg("Could NOT save delivery.\n\n"+e.message);}}
async function saveSettings(){if(!isAdmin)return showMsg("Only Admin");const old=settings();const v={...old,prices:{Petrol:parseFloat(document.getElementById("sP").value),Diesel:parseFloat(document.getElementById("sD").value)},discountPerLitre:parseFloat(document.getElementById("sDisc").value),adminPin:document.getElementById("sPin").value};if(DB.settings[0]){await sbReplace("settings",DB.settings[0].id,v);DB.settings[0].value=v;}else{const id=await sbCreate("settings",v,"settings-1");DB.settings=[{id,value:v}];}await sbCreate("audit",{action:"price_change",targetLabel:"Settings",oldValue:JSON.stringify(old),newValue:JSON.stringify(v),reason:"Settings saved",...stamp()},"audit-"+uid());showMsg("Settings saved");render();}
function adminLogin(){const pin=prompt("Enter Admin PIN (default 1234)");if(pin===settings().adminPin){isAdmin=true;showMsg("Admin Mode ON");}else showMsg("Wrong PIN");render();}
async function delCustomer(id){if(!isAdmin)return;if(!confirm("Delete this customer?"))return;await sbDelete("members",id);DB.members=DB.members.filter(x=>x.id!==id);render();}
async function delTx(id){if(!isAdmin)return;const r=prompt("Reason for deleting (required)");if(!r)return;await sbDelete("transactions",id);await sbCreate("audit",{action:"delete",targetLabel:"Transaction "+id,oldValue:"",newValue:"Deleted",reason:r,...stamp()},"audit-"+uid());DB.transactions=DB.transactions.filter(x=>x.id!==id);render();}
async function testConn(){try{const r=await sFetch(SB+"?select=*&limit=1",{headers:H});const txt=await r.text();showMsg("YY Partshan test:\n\nYY Partshan test: HTTP "+r.status+"\n\n"+txt.slice(0,600));}catch(e){showMsg("YY Partshan test: "+e.message+"\n\nBrowser cannot reach YY Partshan. Entries are saved.");}}
setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleString("en-GB")},1000);
load();
</script></body></html>
