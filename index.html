<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YY PARTSHAN FUELS | Station Management</title>
<style>
:root{--navy:#101d35;--navy2:#1a3154;--orange:#f47721;--amber:#ffb454;--bg:#f4f7fb;--ink:#17243a;--muted:#718096;--line:#e5eaf2;--green:#0d9b72;--red:#d94b55;--blue:#3576d3;--surface:#fff;--shadow:0 12px 34px rgba(17,35,62,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.mast{background:linear-gradient(90deg,#172944,#263f63);color:#dce8f8;text-align:center;padding:7px 12px;font-size:10px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase}
header{background:linear-gradient(125deg,#101d35 0%,#1b365b 68%,#24476b 100%);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 8px 25px #0c1c3326;border-bottom:1px solid #ffffff12}
.head{max-width:1400px;margin:auto;padding:17px 26px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#ff9a3c,#ef6417);display:grid;place-items:center;font-size:27px;box-shadow:0 8px 20px #f4772140}h1{font-size:23px;margin:0;letter-spacing:.4px;font-weight:900}h1 span{color:#ffb454}.sub{font-size:11px;color:#c5d3e5;text-transform:uppercase;letter-spacing:1.5px;margin-top:3px}.status{font-size:11px;font-weight:800;border:1px solid #ffffff30;background:#ffffff12;border-radius:30px;padding:8px 12px}.clock{font:11px ui-monospace,monospace;text-align:right;color:#d6e4f5;margin-top:6px}
.wrap{max-width:1400px;margin:auto;padding:22px 26px 54px}.tabs{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:8px;border-radius:16px;box-shadow:0 5px 18px #17243a08;margin-bottom:20px}.tabs button{background:transparent;color:#53647b;padding:10px 13px;border-radius:10px;font-size:12px}.tabs button.active{background:var(--navy);color:#fff;box-shadow:0 5px 12px #10243b24}.tabs button.soft{background:#f3f6fa;color:#34445b;border:1px solid var(--line)}
button{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,#f58a32,#ed681b);color:white;font-weight:800;cursor:pointer;font-size:12px;letter-spacing:.1px;transition:transform .15s,box-shadow .15s,filter .15s;box-shadow:0 4px 10px #f4772122}button:hover{filter:brightness(1.03);transform:translateY(-1px);box-shadow:0 7px 16px #f4772130}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.secondary{background:linear-gradient(135deg,#243f63,#142a49);box-shadow:0 4px 10px #10243b22}.soft{background:#f3f6fa;color:#34445b;border:1px solid var(--line);box-shadow:none}.danger{background:#d94b55;box-shadow:0 4px 10px #d94b5522}.success{background:#0d9b72}
.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}h2{font-size:20px;margin:0 0 5px;letter-spacing:-.35px;color:#14243c}h3{font-size:14px;margin:0 0 13px;color:#20344f}.muted,.small{color:var(--muted);font-size:12px}.grid{display:grid;gap:15px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi{font-size:25px;font-weight:900;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:5px;overflow-wrap:anywhere;color:#172b49;letter-spacing:-.7px}
label{display:block;margin:13px 0 6px;font-size:10px;font-weight:900;letter-spacing:.8px;color:#64748b;text-transform:uppercase}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit;background:#fbfcfe;color:var(--ink);transition:border-color .15s,box-shadow .15s}input:focus,select:focus,textarea:focus{outline:0;border-color:#f29a51;box-shadow:0 0 0 3px #f477211a;background:#fff}input::placeholder{color:#a1adbd}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.notice{padding:13px 15px;border-radius:12px;font-size:12px;font-weight:700;margin:13px 0;border:1px solid transparent}.info{background:#eff6ff;color:#2455a0;border-color:#dceaff}.ok{background:#ecfdf5;color:#087857;border-color:#c8f1df}.warn{background:#fff8e9;color:#93600a;border-color:#f7e4b8}.err{background:#fff0f0;color:#a3313a;border-color:#f7d1d4}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:720px}th,td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:9px;color:#718096;text-transform:uppercase;letter-spacing:.8px;background:#f6f8fb;white-space:nowrap}tbody tr:hover{background:#fafcff}tbody tr:last-child td{border-bottom:0}.bar{height:10px;border-radius:20px;background:#e9eef5;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0d9b72,#48c79c);border-radius:20px}.hidden{display:none!important}.right{text-align:right}.pill{display:inline-block;border-radius:20px;padding:4px 9px;font-size:10px;font-weight:900;background:#edf2f8;color:#40536d}.footer{text-align:center;color:#8a98aa;font-size:11px;padding:24px}.toast{position:fixed;z-index:99;top:18px;left:50%;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:11px;background:#0f766e;color:#fff;font-weight:800;box-shadow:0 10px 30px #0002;font-size:12px}
hr{border:0;border-top:1px solid var(--line)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:17px 16px 42px}}
@media(max-width:620px){.wrap{padding:12px 10px 35px}.head{padding:13px 15px}.g2,.g3,.g4{grid-template-columns:1fr}h1{font-size:19px}.tabs{border-radius:12px}.tabs button{padding:9px 10px;font-size:11px}.card{padding:16px;border-radius:14px}h2{font-size:18px}.kpi{font-size:22px}.status{font-size:10px}}
@media print{header,.mast,.tabs,.actions,button,.footer{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:8px;margin:0}}
</style>
</head>
<body>
<div class="mast">YY PARTSHAN FUELS • ONLINE MANAGEMENT • YESU YA FUGA</div>
<header><div class="head"><div class="brand"><div class="logo">⛽</div><div><h1>YY PARTSHAN <span>FUELS</span></h1><div class="sub">Yesu Ya Fuga • Nabyewanga, Masaka Road</div></div></div><div><div class="status" id="connection">● Connecting to Supabase…</div><div class="clock" id="clock"></div></div></div></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <main id="app"><div class="card">Loading YY PARTSHAN FUELS…</div></main>
  <div class="footer">YY PARTSHAN FUELS • Yesu Ya Fuga • Station Management</div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
"use strict";

/* Supabase project configuration.
   The project reference below was read from the anon JWT you supplied.
   Publishable key is used as apikey; legacy anon JWT is used as bearer token. */
const SUPABASE_URL = "https://toemyhmndarkdjruyvrt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1KHOnldpNIaRZtIzU453xg_mNZNQdeq";
const SUPABASE_ANON_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvZW15aG1uZGFya2RqcnV5dnJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMDU2NTUsImV4cCI6MjExMDc4MTY1NX0.ljW7bZqV4tIpM1rHluZMsE67mkWYMhqZCpGIfur9BYc";

const COLLECTIONS = ["members","attendants","transactions","deliveries","settings","audit","pumps","expenses"];
const DB = Object.fromEntries(COLLECTIONS.map(k=>[k,[]]));
const DEFAULTS = {prices:{Petrol:5850,Diesel:5450},discountPerLitre:30,adminPin:"1234",petrolCapacity:20000,dieselCapacity:25000};
let view="Dashboard", isAdmin=false, search="", online=false, busy=false;
const $ = id => document.getElementById(id);
const money = n => "UGX " + Math.round(Number(n)||0).toLocaleString("en-UG");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36));
const today = () => {const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");};
function stamp(){const d=new Date();return {timestamp:d.toISOString(),date:today(),dateLabel:d.toLocaleDateString("en-GB"),timeLabel:d.toLocaleTimeString("en-GB"),fullTimestamp:d.toLocaleString("en-GB")};}
function toast(message,kind="ok"){const el=$("toast");el.textContent=message;el.style.background=kind==="err"?"#991b1b":kind==="warn"?"#92400e":"#0f766e";el.classList.remove("hidden");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add("hidden"),4200);}
function setConnection(text,good=false){$("connection").textContent=(good?"● ":"● ")+text;$("connection").style.color=good?"#bbf7d0":"#fecaca";}

function localKey(c){return "yy_partshan_v2_"+c;}
function localRead(c){try{return JSON.parse(localStorage.getItem(localKey(c))||"[]");}catch{return [];}}
function localWrite(c,rows){localStorage.setItem(localKey(c),JSON.stringify(rows));}
function saveCache(){for(const c of COLLECTIONS)localWrite(c,DB[c]);}
function headers(extra={}){return {"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+SUPABASE_ANON_JWT,"Content-Type":"application/json",...extra};}
async function api(path,options={},timeout=12000){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
  try{const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers:headers(options.headers||{}),signal:controller.signal});const body=await r.text();if(!r.ok)throw new Error("Supabase HTTP "+r.status+": "+body.slice(0,500));return body?JSON.parse(body):null;}
  finally{clearTimeout(timer);}
}
async function loadCollection(c){
  const rows=await api("app_records?select=id,collection,record_id,value,created_at,updated_at&collection=eq."+encodeURIComponent(c)+"&order=created_at.asc");
  return (rows||[]).map(r=>({id:r.record_id,value:r.value,_dbId:r.id,created_at:r.created_at,updated_at:r.updated_at}));
}
async function refreshAll(show=true){
  if(show)toast("Loading records from Supabase…");
  try{
    const results=await Promise.all(COLLECTIONS.map(loadCollection));
    COLLECTIONS.forEach((c,i)=>DB[c]=results[i]);
    saveCache();online=true;setConnection("Connected • Supabase live",true);
    render();if(show)toast("Latest records loaded from Supabase.");
  }catch(e){
    online=false;setConnection("Offline / connection error");
    COLLECTIONS.forEach(c=>DB[c]=localRead(c));
    render();if(show)toast("Could not reach Supabase. Showing this device's cached data: "+e.message,"err");
  }
}
async function createRecord(c,v,recordId){
  const rid=recordId||uid();
  const payload={collection:c,record_id:rid,value:v};
  try{
    const result=await api("app_records?select=id,record_id,value",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify(payload)});
    const row={id:rid,value:v,_dbId:result?.[0]?.id};const idx=DB[c].findIndex(x=>x.id===rid);if(idx>=0)DB[c][idx]=row;else DB[c].push(row);
    localWrite(c,DB[c]);online=true;setConnection("Saved to Supabase",true);return rid;
  }catch(e){
    // Keep a local copy if internet is unavailable; do not claim it reached the cloud.
    const row={id:rid,value:v,_pending:true};const idx=DB[c].findIndex(x=>x.id===rid);if(idx>=0)DB[c][idx]=row;else DB[c].push(row);
    localWrite(c,DB[c]);online=false;setConnection("Offline • saved on this device");
    throw new Error("Cloud save failed. A local copy was kept on this device. "+e.message);
  }
}
async function replaceRecord(c,rid,v){
  const filter="app_records?collection=eq."+encodeURIComponent(c)+"&record_id=eq."+encodeURIComponent(rid)+"&select=id,record_id,value";
  try{
    const updated=await api(filter,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({value:v})});
    if(!updated?.length){await createRecord(c,v,rid);}
    else{const row={id:rid,value:v,_dbId:updated[0].id};const i=DB[c].findIndex(x=>x.id===rid);if(i>=0)DB[c][i]=row;else DB[c].push(row);localWrite(c,DB[c]);}
    return true;
  }catch(e){throw new Error("Cloud update failed: "+e.message);}
}
async function deleteRecord(c,rid){
  await api("app_records?collection=eq."+encodeURIComponent(c)+"&record_id=eq."+encodeURIComponent(rid),{method:"DELETE"});
  DB[c]=DB[c].filter(x=>x.id!==rid);localWrite(c,DB[c]);
}
async function syncPending(){
  toast("Synchronizing local records…");
  let sent=0,failed=0;
  for(const c of COLLECTIONS){
    for(const r of [...DB[c]].filter(x=>x._pending)){
      try{
        const existing=await api("app_records?select=id&collection=eq."+encodeURIComponent(c)+"&record_id=eq."+encodeURIComponent(r.id));
        if(existing?.length)await replaceRecord(c,r.id,r.value);else await createRecord(c,r.value,r.id);
        const current=DB[c].find(x=>x.id===r.id);if(current)delete current._pending;sent++;
      }catch{failed++;}
    }
  }
  saveCache();await refreshAll(false);
  toast(failed?`Synced ${sent}; ${failed} still pending.`:`Synchronization complete: ${sent} record(s) uploaded.`);
}
function settings(){return {...DEFAULTS,...(DB.settings[0]?.value||{}),prices:{...DEFAULTS.prices,...(DB.settings[0]?.value?.prices||{})}};}
function nextNumber(collection,field,prefix){let max=0;for(const x of DB[collection]){const n=parseInt(String(x.value?.[field]||"").replace(prefix,""),10);if(n>max)max=n;}return prefix+String(max+1).padStart(3,"0");}
function nextCustomer(){return nextNumber("members","customerId","YY-");}
function nextAttendant(){return nextNumber("attendants","attendantId","ATT-");}
function stats(memberId){
  let balance=0,debt=0,deposits=0,fuel=0,discount=0;
  for(const t of DB.transactions){const v=t.value;if(v.memberId!==memberId)continue;
    if(v.kind==="deposit"){const clear=Math.min(v.amount,debt);debt-=clear;balance+=v.amount-clear;deposits+=v.amount;}
    if(v.kind==="fuel"){if(v.isCredit)debt+=v.amount;else balance-=v.amount;fuel+=v.amount;discount+=v.discount||0;}
  }
  return {balance,debt,deposits,fuel,discount};
}
function stock(fuel){let litres=0;for(const d of DB.deliveries)if(d.value.fuel===fuel)litres+=Number(d.value.litres)||0;for(const t of DB.transactions)if(t.value.kind==="fuel"&&t.value.fuel===fuel)litres-=Number(t.value.litres)||0;return litres;}
function member(id){return DB.members.find(x=>x.id===id);}
function attendant(id){return DB.attendants.find(x=>x.id===id);}
function nav(){
  const tabs=["Dashboard","Customers","Attendants","Deposit Money","Issue Fuel","Transactions","Fuel Stock","Daily Closing","Deliveries","Expenses","Statement","Settings"];
  $("tabs").innerHTML=tabs.map(t=>`<button class="${view===t?"active":""}" data-view="${t}">${t}</button>`).join("")+
    `<button class="soft" id="refreshBtn">Refresh</button><button class="soft" id="syncBtn">Sync Pending</button>`;
  $("tabs").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
  $("refreshBtn").onclick=()=>refreshAll(true);$("syncBtn").onclick=syncPending;
}
function field(label,id,type="text",placeholder="",value=""){const hint=placeholder||("Enter "+String(label).toLowerCase());return `<label>${esc(label)}</label><input id="${esc(id)}" type="${esc(type)}" placeholder="${esc(hint)}" value="${esc(value)}" autocomplete="off">`;}
function customerOptions(id){return DB.members.map(m=>`<option value="${esc(m.id)}" ${m.id===id?"selected":""}>${esc(m.value.customerId)} — ${esc(m.value.name)} (Bal ${money(stats(m.id).balance)}${stats(m.id).debt?`, Debt ${money(stats(m.id).debt)}`:""})</option>`).join("");}
function attendantOptions(id){return `<option value="">Select attendant</option>`+DB.attendants.map(a=>`<option value="${esc(a.id)}" ${a.id===id?"selected":""}>${esc(a.value.attendantId)} — ${esc(a.value.name)}</option>`).join("");}
function render(){
  nav();const el=$("app"),S=settings(),d=today();
  const todays=DB.transactions.filter(x=>x.value.date===d),fuelTx=todays.filter(x=>x.value.kind==="fuel");
  const totalSales=fuelTx.reduce((a,x)=>a+(+x.value.amount||0),0),totalLitres=fuelTx.reduce((a,x)=>a+(+x.value.litres||0),0),totalDiscount=fuelTx.reduce((a,x)=>a+(+x.value.discount||0),0);
  const balances=DB.members.reduce((a,m)=>a+stats(m.id).balance,0),debts=DB.members.reduce((a,m)=>a+stats(m.id).debt,0);
  let html="";
  if(!online)html+=`<div class="notice warn">You are viewing locally cached records. New entries will be kept on this device if the cloud is unreachable. Use Sync Pending after reconnecting.</div>`;
  if(view==="Dashboard"){
    html+=`<section class="card"><h2>Business Overview</h2><div class="muted">${new Date().toLocaleDateString("en-GB",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div>
    <div class="grid g4" style="margin-top:18px"><div><div class="small">MEMBER BALANCES</div><div class="kpi">${money(balances)}</div></div><div><div class="small">TODAY'S FUEL SALES</div><div class="kpi">${money(totalSales)}</div></div><div><div class="small">TODAY'S LITRES</div><div class="kpi">${totalLitres.toFixed(1)} L</div></div><div><div class="small">TODAY'S DISCOUNT</div><div class="kpi">${money(totalDiscount)}</div></div></div>
    <p class="small">Customers <b>${DB.members.length}</b> • Attendants <b>${DB.attendants.length}</b> • Customer debt <b>${money(debts)}</b> • Petrol stock <b>${stock("Petrol").toFixed(1)} L</b> • Diesel stock <b>${stock("Diesel").toFixed(1)} L</b></p></section>
    <section class="card"><h3>Search records</h3><input id="globalSearch" placeholder="Search customers, phone numbers, transactions…" value="${esc(search)}"></section>
    <section class="card"><h3>Recent transactions</h3>${DB.transactions.slice().reverse().slice(0,12).map(t=>`<div class="row"><div><b>${esc(t.value.kind)}</b> • ${esc(t.value.memberName||"Walk-in")}<div class="small">${esc(t.value.fuel||"")} ${t.value.litres?`• ${t.value.litres} L`:""} • ${esc(t.value.attendantName||"")}</div></div><div class="right"><b>${money(t.value.amount)}</b><div class="small">${esc(t.value.dateLabel||t.value.date||"")} ${esc(t.value.timeLabel||"")}</div></div></div>`).join("")||`<p class="muted">No transactions recorded yet.</p>`}</section>`;
  }
  if(view==="Customers"){
    html+=`<section class="card"><h2>Register Customer</h2><p class="small">Next customer number: <b>${nextCustomer()}</b></p><div class="grid g3">${field("Customer name","cName")}${field("Phone number","cPhone","tel")}${field("Vehicle plate (optional)","cPlate")}</div><div class="actions"><button id="addCustomer">Register Customer</button></div></section>
    <section class="card"><h3>Customers (${DB.members.length})</h3><input id="customerSearch" placeholder="Search name, phone or customer ID" value="${esc(search)}"><div class="tablewrap"><table><thead><tr><th>Customer ID</th><th>Name</th><th>Phone</th><th>Plate</th><th>Balance</th><th>Debt</th><th>Status</th><th>Action</th></tr></thead><tbody>${DB.members.filter(m=>(`${m.value.name} ${m.value.phone} ${m.value.customerId}`).toLowerCase().includes(search.toLowerCase())).map(m=>{const s=stats(m.id);return `<tr><td><b>${esc(m.value.customerId)}</b></td><td>${esc(m.value.name)}</td><td>${esc(m.value.phone)}</td><td>${esc(m.value.plate||"—")}</td><td>${money(s.balance)}</td><td>${money(s.debt)}</td><td>${esc(m.value.status||"Active")}</td><td>${isAdmin?`<button class="danger" data-del-customer="${esc(m.id)}">Delete</button>`:"—"}</td></tr>`}).join("")||`<tr><td colspan="8">No customers found.</td></tr>`}</tbody></table></div><div class="actions"><button class="secondary" id="adminLogin">${isAdmin?"Admin mode ON":"Admin Login"}</button></div></section>`;
  }
  if(view==="Attendants"){
    html+=`<section class="card"><h2>Register Attendant</h2><p class="small">Next attendant number: <b>${nextAttendant()}</b></p><div class="grid g2">${field("Attendant name","aName")}${field("Phone number","aPhone","tel")}</div><div class="actions"><button id="addAttendant">Register Attendant</button></div></section><section class="card"><h3>Attendants (${DB.attendants.length})</h3>${DB.attendants.map(a=>`<div class="row"><span><b>${esc(a.value.attendantId)}</b> — ${esc(a.value.name)}<div class="small">${esc(a.value.phone)}</div></span><span class="pill">${esc(a.value.status||"Active")}</span></div>`).join("")||"No attendants registered."}</section>`;
  }
  if(view==="Deposit Money"){
    html+=`<section class="card"><h2>Deposit Money</h2>${DB.members.length?`<label>Customer</label><select id="depCustomer">${customerOptions()}</select>${field("Deposit amount (UGX)","depAmount","number","Enter amount") }<label>Attendant</label><select id="depAttendant">${attendantOptions()}</select><div class="actions"><button id="saveDeposit">Save Deposit</button></div><p class="small">Deposits clear outstanding debt first. Any remaining amount is added to the customer's balance.</p>`:`<div class="notice warn">Register a customer before recording a deposit.</div>`}</section>`;
  }
  if(view==="Issue Fuel"){
    html+=`<section class="card"><h2>Issue Fuel to Customer</h2>${DB.members.length?`<div class="grid g2"><div><label>Customer</label><select id="fuelCustomer">${customerOptions()}</select></div><div><label>Fuel type</label><select id="fuelType"><option>Petrol</option><option>Diesel</option></select></div></div>${field("Litres","fuelLitres","number","0.0")}<div id="fuelCalc" class="notice info">Enter litres to calculate member price and total.</div><div class="grid g3"><div><label>Pump</label><select id="fuelPump"><option value="">Select pump</option><option>Pump 1</option><option>Pump 2</option><option>Pump 3</option></select></div><div><label>Attendant</label><select id="fuelAttendant">${attendantOptions()}</select></div><div><label>Shift</label><select id="fuelShift"><option value="">Select shift</option><option>Day Shift</option><option>Night Shift</option></select></div></div><label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px"><input type="checkbox" id="fuelCredit" style="width:auto"> Issue on credit (only when customer has no existing debt)</label><div class="actions"><button id="saveFuel">Save Fuel Issue</button></div>`:`<div class="notice warn">Register a customer before issuing fuel.</div>`}</section>`;
  }
  if(view==="Transactions"){
    html+=`<section class="card"><h2>Transactions Ledger</h2><input id="txSearch" placeholder="Search transaction records…" value="${esc(search)}"><div class="tablewrap"><table><thead><tr><th>Date / Time</th><th>Customer</th><th>Type</th><th>Fuel / Litres</th><th>Amount</th><th>Attendant</th><th>Pump / Shift</th><th>Action</th></tr></thead><tbody>${DB.transactions.slice().reverse().filter(t=>JSON.stringify(t.value).toLowerCase().includes(search.toLowerCase())).map(t=>`<tr><td>${esc(t.value.dateLabel||t.value.date)}<div class="small">${esc(t.value.timeLabel||"")}</div></td><td>${esc(t.value.memberName||"")}</td><td>${esc(t.value.kind)} ${t.value.isCredit?'<span class="pill">CREDIT</span>':""}</td><td>${esc(t.value.fuel||"")} ${t.value.litres?esc(t.value.litres)+" L":""}</td><td><b>${money(t.value.amount)}</b></td><td>${esc(t.value.attendantName||"")}</td><td>${esc(t.value.pump||"")} ${esc(t.value.shift||"")}</td><td>${isAdmin?`<button class="danger" data-del-tx="${esc(t.id)}">Delete</button>`:"—"}</td></tr>`).join("")||`<tr><td colspan="8">No transactions found.</td></tr>`}</tbody></table></div>${isAdmin?`<p class="small">Deleting a transaction changes the customer's balance and stock calculations. Record a reason in the audit log.</p>`:""}</section>`;
  }
  if(view==="Fuel Stock"){
    html+=`<section class="card"><h2>Fuel Stock Position</h2>${["Petrol","Diesel"].map(f=>{const s=stock(f),cap=Number(f==="Petrol"?S.petrolCapacity:S.dieselCapacity)||1,pct=Math.max(0,Math.min(100,s/cap*100));return `<div style="margin:18px 0"><div class="row"><b>${f}</b><b>${s.toFixed(1)} L / ${cap.toLocaleString()} L</b></div><div class="bar"><i style="width:${pct}%"></i></div><div class="small">${pct.toFixed(1)}% of configured capacity</div></div>`}).join("")}</section><section class="card"><h3>Record Fuel Delivery (Stock In)</h3><div class="grid g3"><div><label>Fuel</label><select id="deliveryFuel"><option>Petrol</option><option>Diesel</option></select></div>${field("Litres received","deliveryLitres","number")}${field("Supplier (optional)","deliverySupplier")}</div>${field("Delivery cost (UGX, optional)","deliveryAmount","number")}<div class="actions"><button id="saveDelivery">Add Delivery</button></div></section>`;
  }
  if(view==="Daily Closing"){
    const tx=todays,ft=tx.filter(x=>x.value.kind==="fuel"),dp=tx.filter(x=>x.value.kind==="deposit");
    const sum=a=>a.reduce((s,x)=>s+(+x.value.amount||0),0),lit=a=>a.reduce((s,x)=>s+(+x.value.litres||0),0);
    const p=ft.filter(x=>x.value.fuel==="Petrol"),ds=ft.filter(x=>x.value.fuel==="Diesel");
    html+=`<section class="card"><h2>Daily Closing — ${d}</h2><div class="grid g3"><div><div class="small">TOTAL FUEL SALES</div><div class="kpi">${money(sum(ft))}</div></div><div><div class="small">TOTAL LITRES ISSUED</div><div class="kpi">${lit(ft).toFixed(1)} L</div></div><div><div class="small">DEPOSITS RECEIVED</div><div class="kpi">${money(sum(dp))}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p><b>Petrol:</b> ${money(sum(p))} • ${lit(p).toFixed(1)} L</p><p><b>Diesel:</b> ${money(sum(ds))} • ${lit(ds).toFixed(1)} L</p><p><b>Fuel issues:</b> ${ft.length} • <b>Deposits:</b> ${dp.length} • <b>Customers:</b> ${DB.members.length}</p></section>`;
  }
  if(view==="Deliveries"){
    html+=`<section class="card"><h2>Fuel Deliveries</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Fuel</th><th>Litres</th><th>Supplier</th><th>Cost</th></tr></thead><tbody>${DB.deliveries.slice().reverse().map(x=>`<tr><td>${esc(x.value.dateLabel||x.value.date)}</td><td>${esc(x.value.fuel)}</td><td>${Number(x.value.litres||0).toLocaleString()}</td><td>${esc(x.value.supplier||"—")}</td><td>${money(x.value.amount||0)}</td></tr>`).join("")||`<tr><td colspan="5">No deliveries recorded.</td></tr>`}</tbody></table></div></section>`;
  }
  if(view==="Expenses"){
    const total=DB.expenses.reduce((a,x)=>a+(+x.value.amount||0),0);
    html+=`<section class="card"><h2>Expenses</h2><div class="kpi">${money(total)}</div><p class="small">Total recorded expenses</p><h3 style="margin-top:20px">Add Expense</h3>${field("Expense description","expenseTitle")}${field("Amount (UGX)","expenseAmount","number")}<div class="actions"><button id="saveExpense">Save Expense</button></div></section><section class="card"><h3>Expense History</h3>${DB.expenses.slice().reverse().map(x=>`<div class="row"><span><b>${esc(x.value.title)}</b><div class="small">${esc(x.value.dateLabel||x.value.date)}</div></span><b>${money(x.value.amount)}</b></div>`).join("")||"No expenses recorded."}</section>`;
  }
  if(view==="Statement"){
    html+=`<section class="card"><h2>Customer Statements</h2><input id="statementSearch" placeholder="Search customer…" value="${esc(search)}">${DB.members.filter(m=>(m.value.name+" "+m.value.customerId+" "+m.value.phone).toLowerCase().includes(search.toLowerCase())).map(m=>{const s=stats(m.id),tx=DB.transactions.filter(x=>x.value.memberId===m.id);return `<div class="card" style="margin:12px 0;background:#fbfdff"><div class="row"><div><b>${esc(m.value.name)} (${esc(m.value.customerId)})</b><div class="small">${esc(m.value.phone)}</div></div><div class="right"><b>${money(s.balance)}</b><div class="small">Balance • Debt ${money(s.debt)}</div></div></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Details</th><th>Amount</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${esc(x.value.date||"")}</td><td>${esc(x.value.kind)} ${esc(x.value.fuel||"")} ${x.value.litres?esc(x.value.litres)+" L":""} ${x.value.isCredit?"(Credit)":""}</td><td>${money(x.value.amount)}</td></tr>`).join("")||`<tr><td colspan="3">No transactions yet.</td></tr>`}</tbody></table></div><button class="soft" data-print="${esc(m.id)}">Print statement</button></div>`}).join("")||`<p class="muted">No matching customers.</p>`}</section>`;
  }
  if(view==="Settings"){
    html+=`<section class="card"><h2>System Settings</h2><div class="notice warn"><b>Security note:</b> The current administrator PIN is only a browser-side screen lock. Before using real customer and cash records in production, enable Supabase Authentication and restrictive Row Level Security policies. Never place a service-role key in this app.</div><div class="grid g2">${field("Petrol pump price (UGX/L)","setPetrol","number","",S.prices.Petrol)}${field("Diesel pump price (UGX/L)","setDiesel","number","",S.prices.Diesel)}${field("Member discount per litre (UGX)","setDiscount","number","",S.discountPerLitre)}${field("Admin PIN","setPin","password","",S.adminPin)}${field("Petrol tank capacity (L)","setPetrolCap","number","",S.petrolCapacity)}${field("Diesel tank capacity (L)","setDieselCap","number","",S.dieselCapacity)}</div><div class="actions"><button id="saveSettings">Save Settings</button><button class="secondary" id="adminLogin">${isAdmin?"Admin mode ON":"Admin Login"}</button><button class="soft" id="exportBackup">Export Backup JSON</button><button class="soft" id="importBackup">Import Backup JSON</button><input id="backupFile" type="file" accept="application/json" class="hidden"></div></section>
    <section class="card"><h3>Connection details</h3><p class="small">Project: <b>${esc(new URL(SUPABASE_URL).host)}</b><br>Table: <b>public.app_records</b><br>Collections: ${COLLECTIONS.join(", ")}</p><div class="actions"><button class="secondary" id="testConnection">Test Supabase connection</button><button class="soft" id="syncPending2">Sync pending local records</button></div></section>
    <section class="card"><h3>Audit log</h3>${isAdmin?DB.audit.slice().reverse().map(a=>`<div class="row"><span>${esc(a.value.action)} — ${esc(a.value.targetLabel)}<div class="small">${esc(a.value.reason||"")} • ${esc(a.value.dateLabel||"")}</div></span></div>`).join("")||"No audit events yet.":"Log in as admin to view audit entries."}</section>`;
  }
  el.innerHTML=html;
  wireEvents();
}
function wireEvents(){
  const on=(id,fn)=>{const x=$(id);if(x)x.addEventListener("click",fn);};
  const input=(id,fn)=>{const x=$(id);if(x)x.addEventListener("input",fn);};
  input("globalSearch",e=>{search=e.target.value;const p=e.target.selectionStart;render();$("globalSearch")?.focus();$("globalSearch")?.setSelectionRange(p,p);});
  input("customerSearch",e=>{search=e.target.value;render();$("customerSearch")?.focus();});
  input("txSearch",e=>{search=e.target.value;render();$("txSearch")?.focus();});
  input("statementSearch",e=>{search=e.target.value;render();$("statementSearch")?.focus();});
  on("addCustomer",addCustomer);on("addAttendant",addAttendant);on("saveDeposit",doDeposit);on("saveFuel",doFuel);on("saveDelivery",doDelivery);on("saveExpense",addExpense);on("saveSettings",saveSettings);
  on("adminLogin",adminLogin);on("testConnection",()=>refreshAll(true));on("syncPending2",syncPending);on("exportBackup",exportBackup);on("importBackup",()=>$("backupFile").click());
  const bf=$("backupFile");if(bf)bf.onchange=importBackup;
  const fl=$("fuelLitres");if(fl){fl.oninput=calcFuel; $("fuelType").onchange=calcFuel;$("fuelCustomer").onchange=calcFuel;}
  document.querySelectorAll("[data-del-customer]").forEach(b=>b.onclick=()=>deleteCustomer(b.dataset.delCustomer));
  document.querySelectorAll("[data-del-tx]").forEach(b=>b.onclick=()=>deleteTransaction(b.dataset.delTx));
  document.querySelectorAll("[data-print]").forEach(b=>b.onclick=()=>printStatement(b.dataset.print));
}
async function addCustomer(){
  const name=$("cName").value.trim(),phone=$("cPhone").value.trim(),plate=$("cPlate").value.trim();
  if(!name||!phone)return toast("Customer name and phone are required.","warn");
  if(DB.members.some(m=>m.value.phone===phone))return toast("A customer with this phone number already exists.","warn");
  const v={name,phone,plate,customerId:nextCustomer(),status:"Active",dateJoined:today(),...stamp()};
  try{await createRecord("members",v,"cust-"+uid());toast("Customer saved: "+v.customerId);render();}
  catch(e){toast(e.message,"err");render();}
}
async function addAttendant(){
  const name=$("aName").value.trim(),phone=$("aPhone").value.trim();
  if(!name||!phone)return toast("Attendant name and phone are required.","warn");
  const v={name,phone,attendantId:nextAttendant(),status:"Active",...stamp()};
  try{await createRecord("attendants",v,"att-"+uid());toast("Attendant saved: "+v.attendantId);render();}
  catch(e){toast(e.message,"err");render();}
}
async function saveTransaction(v){return createRecord("transactions",v,"tx-"+uid());}
async function doDeposit(){
  const mid=$("depCustomer")?.value,amount=Number($("depAmount")?.value||0),aid=$("depAttendant")?.value;
  if(!mid||!(amount>0))return toast("Select a customer and enter a valid amount.","warn");
  const m=member(mid),a=attendant(aid),s=stamp();
  const v={kind:"deposit",memberId:mid,memberName:m.value.name,amount,attendantName:a?.value.name||"",attendantPhone:a?.value.phone||"",attendantId:a?.value.attendantId||"",...s};
  try{await saveTransaction(v);toast("Deposit saved: "+money(amount));render();}
  catch(e){toast(e.message,"err");render();}
}
function calcFuel(){
  const litres=Number($("fuelLitres")?.value||0),fuel=$("fuelType")?.value||"Petrol",S=settings(),pump=S.prices[fuel],memberPrice=Math.max(0,pump-S.discountPerLitre);
  const el=$("fuelCalc");if(!el)return;
  if(!(litres>0)){el.textContent="Enter litres to calculate member price and total.";return;}
  el.innerHTML=`Pump price: <b>${money(pump)}/L</b> • Member price: <b>${money(memberPrice)}/L</b><br>Discount: <b>${money(litres*S.discountPerLitre)}</b> • Amount payable: <b>${money(litres*memberPrice)}</b> • Available stock: <b>${stock(fuel).toFixed(1)} L</b>`;
}
async function doFuel(){
  const mid=$("fuelCustomer")?.value,fuel=$("fuelType")?.value,litres=Number($("fuelLitres")?.value||0),pump=$("fuelPump")?.value,aid=$("fuelAttendant")?.value,shift=$("fuelShift")?.value,credit=$("fuelCredit")?.checked;
  if(!mid||!(litres>0)||!pump||!aid||!shift)return toast("Customer, litres, pump, attendant and shift are required.","warn");
  if(litres>stock(fuel))return toast("Insufficient "+fuel+" stock. Available: "+stock(fuel).toFixed(1)+" L","warn");
  const m=member(mid),a=attendant(aid),st=stats(mid),S=settings();
  if(credit&&st.debt>0)return toast("This customer already has outstanding debt. Clear it before giving more credit.","warn");
  const memberPrice=Math.max(0,S.prices[fuel]-S.discountPerLitre),amount=litres*memberPrice;
  if(!credit&&amount>st.balance)return toast("Insufficient customer balance. Balance: "+money(st.balance)+". Use credit only if permitted.","warn");
  const v={kind:"fuel",memberId:mid,memberName:m.value.name,amount,fuel,pump,litres,pumpPrice:S.prices[fuel],memberPrice,normalTotal:litres*S.prices[fuel],discount:litres*S.discountPerLitre,isCredit:credit,attendantName:a.value.name,attendantPhone:a.value.phone,attendantId:a.value.attendantId,shift,...stamp()};
  try{await saveTransaction(v);toast(`${litres} L ${fuel} issued • ${money(amount)}${credit?" on credit":""}`);render();}
  catch(e){toast(e.message,"err");render();}
}
async function doDelivery(){
  const fuel=$("deliveryFuel").value,litres=Number($("deliveryLitres").value||0),supplier=$("deliverySupplier").value.trim(),amount=Number($("deliveryAmount").value||0);
  if(!(litres>0))return toast("Enter valid delivery litres.","warn");
  const v={fuel,litres,supplier,amount,...stamp()};
  try{await createRecord("deliveries",v,"dl-"+uid());toast("Fuel delivery saved.");render();}
  catch(e){toast(e.message,"err");render();}
}
async function addExpense(){
  const title=$("expenseTitle").value.trim(),amount=Number($("expenseAmount").value||0);
  if(!title||!(amount>0))return toast("Enter expense description and a valid amount.","warn");
  try{await createRecord("expenses",{title,amount,...stamp()},"ex-"+uid());toast("Expense saved.");render();}
  catch(e){toast(e.message,"err");render();}
}
async function saveSettings(){
  if(!isAdmin)return toast("Admin login required to change settings.","warn");
  const old=settings(),v={...old,prices:{Petrol:Number($("setPetrol").value),Diesel:Number($("setDiesel").value)},discountPerLitre:Number($("setDiscount").value),adminPin:$("setPin").value,petrolCapacity:Number($("setPetrolCap").value),dieselCapacity:Number($("setDieselCap").value)};
  if(!Number.isFinite(v.prices.Petrol)||!Number.isFinite(v.prices.Diesel)||!v.adminPin)return toast("Enter valid prices and PIN.","warn");
  try{
    if(DB.settings[0])await replaceRecord("settings",DB.settings[0].id,v);
    else await createRecord("settings",v,"settings-1");
    await createRecord("audit",{action:"settings_updated",targetLabel:"System settings",reason:"Settings saved by admin",...stamp()},"audit-"+uid());
    toast("Settings saved to Supabase.");render();
  }catch(e){toast(e.message,"err");}
}
function adminLogin(){
  const pin=prompt("Enter administrator PIN:");
  if(pin===null)return;
  if(pin===settings().adminPin){isAdmin=true;toast("Admin mode enabled.");render();}
  else toast("Incorrect administrator PIN.","err");
}
async function deleteCustomer(id){
  if(!isAdmin)return;
  if(DB.transactions.some(t=>t.value.memberId===id))return toast("This customer has transactions. Keep the account for accurate financial history.","warn");
  if(!confirm("Permanently delete this customer?"))return;
  try{await deleteRecord("members",id);await createRecord("audit",{action:"customer_deleted",targetLabel:id,reason:"Deleted by admin",...stamp()},"audit-"+uid());toast("Customer deleted.");render();}
  catch(e){toast(e.message,"err");}
}
async function deleteTransaction(id){
  if(!isAdmin)return;
  const reason=prompt("Enter the reason for deleting this transaction:");
  if(!reason?.trim())return;
  if(!confirm("Delete this transaction? Customer balances and stock will be recalculated."))return;
  try{await deleteRecord("transactions",id);await createRecord("audit",{action:"transaction_deleted",targetLabel:id,reason,...stamp()},"audit-"+uid());toast("Transaction deleted.");render();}
  catch(e){toast(e.message,"err");}
}
function printStatement(id){
  const m=member(id);if(!m)return;const s=stats(id),tx=DB.transactions.filter(x=>x.value.memberId===id);
  const w=window.open("","_blank");if(!w)return toast("Allow pop-ups to print the statement.","warn");
  w.document.write(`<html><head><title>Customer Statement</title><style>body{font:14px Arial;padding:30px}h1{color:#10243b}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}</style></head><body><h1>YY PARTSHAN FUELS</h1><h2>Customer Statement</h2><p>${esc(m.value.name)} • ${esc(m.value.customerId)} • ${esc(m.value.phone)}</p><p>Balance: ${money(s.balance)} | Debt: ${money(s.debt)}</p><table><tr><th>Date</th><th>Transaction</th><th>Amount</th></tr>${tx.map(x=>`<tr><td>${esc(x.value.date)}</td><td>${esc(x.value.kind)} ${esc(x.value.fuel||"")} ${esc(x.value.litres||"")} L</td><td>${money(x.value.amount)}</td></tr>`).join("")}</table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();
}
function exportBackup(){
  const data={system:"YY PARTSHAN FUELS",exportedAt:new Date().toISOString(),collections:Object.fromEntries(COLLECTIONS.map(c=>[c,DB[c].map(r=>({id:r.id,value:r.value}))]))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="YY-PARTSHAN-FUELS-backup-"+today()+".json";a.click();URL.revokeObjectURL(url);toast("Backup downloaded.");
}
async function importBackup(e){
  const file=e.target.files?.[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());if(!data.collections)throw new Error("Invalid backup format.");
    if(!confirm("Import backup records into Supabase? Existing records with the same IDs will be updated."))return;
    for(const c of COLLECTIONS)for(const r of data.collections[c]||[]){
      const found=await api("app_records?select=id&collection=eq."+encodeURIComponent(c)+"&record_id=eq."+encodeURIComponent(r.id));
      if(found?.length)await replaceRecord(c,r.id,r.value);else await createRecord(c,r.value,r.id);
    }
    await refreshAll(false);toast("Backup imported.");render();
  }catch(err){toast("Import failed: "+err.message,"err");}
  finally{e.target.value="";}
}
setInterval(()=>$("clock").textContent=new Date().toLocaleString("en-GB"),1000);
window.addEventListener("online",()=>{setConnection("Internet available • checking…");refreshAll(false);});
window.addEventListener("offline",()=>{online=false;setConnection("Offline • cached data");});
(async()=>{await refreshAll(false);})();
